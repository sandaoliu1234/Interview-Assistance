<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!-- 移动端 viewport：适配微信内浏览器 + 防止双击缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>面试辅助 · 手机端</title>
<style>
  /* ============================================================
     H5 手机端样式（2026-08-19 重构）：
     · 与电脑答题面板 overlay.html 同一视觉语言：深色 HireMe 蓝主题 / 毛玻璃 / 圆角卡片
     · 布局：顶部头部（连接状态 + 快捷操作）→ 中部滚动区（面试官 → AI 助手）→ 底部固定输入栏
     · 字体与面板一致：面试官 15px，AI 答案 14px，并支持 Markdown 渲染（不再把 ### 当纯文本）
     · 已移除调试面板（用户明确要求不再显示 URL/Host/Token/健康检查/请求日志等调试信息）
  ============================================================ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0f17;              /* 与 overlay.css 同底色：深蓝黑 */
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.55;
    overflow: hidden; /* 主滚动交给 .panel-scroll-body，防止手机橡皮筋拉到 body */
  }

  /* ==== 全局尺寸常量：与面板 overlay.css 一致 ==== */
  :root {
    --bg-page:        #0b0f17;
    --bg-elevated:    #141b2a;
    --bg-card:        #1a2332;
    --bg-card-hover:  #202c3e;
    --bg-input:       #111827;
    --border:         rgba(255, 255, 255, 0.08);
    --border-strong:  rgba(255, 255, 255, 0.14);
    --border-active:  rgba(59, 130, 246, 0.55);
    --accent:         #3b82f6;
    --accent-hover:   #2563eb;
    --accent-soft:    rgba(59, 130, 246, 0.16);
    --accent-ink:     #93c5fd;
    --text-primary:   #f3f4f6;
    --text-secondary: #9ca3af;
    --text-tertiary:  #6b7280;
    --success:        #22c55e;
    --warning:        #f59e0b;
    --danger:         #ef4444;
    --radius-sm:      6px;
    --radius:         10px;
    --radius-lg:      14px;
    --radius-pill:    999px;
  }

  /* ==== 整体 App 容器：铺满 100vh，三段式 flex ==== */
  .app {
    display: flex; flex-direction: column;
    width: 100%; height: 100vh; height: 100dvh; /* dvh 适配手机浏览器地址栏 */
    max-width: 760px; margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  /* ==== 顶部头部：状态徽章 + 快捷按钮（与 overlay.header 风格一致）==== */
  .app-header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px 16px;
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.14), transparent);
    z-index: 5;
  }
  .app-title {
    font-size: 16px; font-weight: 600; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  .app-title .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--warning); box-shadow: 0 0 8px var(--warning);
    animation: pulse 1.6s infinite ease-in-out;
  }
  .app-title .dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .app-title .dot.bad { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  .header-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-primary); font-size: 16px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; transition: all 0.15s ease;
    -webkit-appearance: none; appearance: none;
  }
  .icon-btn:active { background: var(--accent-soft); border-color: var(--border-active); color: var(--accent-ink); }
  .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-badge {
    padding: 4px 10px; border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 500; color: var(--warning);
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.25);
  }
  .status-badge.ok { color: var(--success); background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.25); }
  .status-badge.bad { color: var(--danger); background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.25); }

  /* ==== 中部滚动容器：唯一纵向滚动条（与 overlay.panel-scroll-body 一致）==== */
  .panel-scroll-body {
    flex: 1 1 auto;
    min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 4px 16px 14px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(59, 130, 246, 0.45) rgba(255, 255, 255, 0.04);
    -webkit-overflow-scrolling: touch;
  }
  .panel-scroll-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .panel-scroll-body::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); border-radius: 999px; }
  .panel-scroll-body::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.38); border-radius: 999px; }
  .panel-scroll-body::-webkit-scrollbar-thumb:active { background: rgba(37, 99, 235, 0.85); }

  /* ==== 通用 label：面试官 / AI 助手标题（与面板 label 同级尺寸）==== */
  .section-label {
    display: block;
    font-size: 11px; font-weight: 600;
    color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em;
    margin: 14px 0 8px;
  }
  .section-label:first-child { margin-top: 6px; }
  .section-label.interviewer { color: var(--text-tertiary); }
  .section-label.ai { color: var(--accent-ink); }

  /* ==== 面试官截图：大尺寸显示 + 黑底兜底 + 点击放大（与面板 interview-screenshot-* 一致）==== */
  .interview-screenshot-wrap {
    display: none; margin: 0 0 10px;
  }
  .interview-screenshot-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .interview-screenshot-title {
    font-size: 12px; color: var(--text-secondary); font-weight: 500;
  }
  .interview-screenshot-close {
    background: transparent; color: var(--text-secondary);
    border: 1px solid var(--border); cursor: pointer; font-size: 14px; line-height: 1;
    padding: 2px 8px; border-radius: var(--radius-sm);
  }
  .interview-screenshot-close:active { color: var(--danger); background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.35); }
  .interview-screenshot-img {
    display: block; width: 100%; max-height: 420px; object-fit: contain;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: #000;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    cursor: zoom-in;
  }

  /* ==== 面试官文本框：与面板 interim-display 一致 ==== */
  .interim-display {
    font-size: 15px; color: var(--text-primary);
    min-height: 44px; padding: 12px 14px;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    border: 1px dashed var(--border-strong);
    line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    margin-bottom: 4px;
  }
  .interim-display:empty::before {
    content: '（暂无面试官内容）';
    color: var(--text-tertiary); font-style: italic; font-size: 13px;
  }

  /* ==== AI 答案文本框：与面板 answer-display 一致（蓝色渐变高亮边框）==== */
  .answer-display {
    font-size: 14px; color: var(--text-primary);
    min-height: 60px;
    padding: 12px 14px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.12) 0%, rgba(59, 130, 246, 0.04) 100%);
    border-radius: var(--radius);
    border: 1px solid var(--border-active);
    line-height: 1.6;
    white-space: normal; word-break: break-word;
  }
  .answer-display.waiting {
    color: var(--text-tertiary); font-style: italic;
    background: var(--bg-elevated);
    border: 1px dashed var(--border);
  }
  .answer-display.waiting::before {
    content: '（暂无 AI 答案，提交提问后显示）';
  }

  /* ==== Markdown 渲染样式（复用面板的视觉规范：标题/列表/代码/引用/加粗）==== */
  .answer-display h1, .answer-display h2, .answer-display h3,
  .answer-display h4, .answer-display h5, .answer-display h6,
  .interim-display h1, .interim-display h2, .interim-display h3 {
    color: var(--text-primary); font-weight: 600; line-height: 1.35;
    margin: 14px 0 10px; letter-spacing: 0.01em;
  }
  .answer-display h1, .interim-display h1 { font-size: 1.25rem; border-bottom: 1px solid var(--border-strong); padding-bottom: 6px; }
  .answer-display h2, .interim-display h2 { font-size: 1.1rem; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }
  .answer-display h3, .interim-display h3 { font-size: 1rem; color: var(--accent); }
  .answer-display h4, .interim-display h4 { font-size: 0.95rem; }
  .answer-display h5, .interim-display h5 { font-size: 0.88rem; }
  .answer-display h6, .interim-display h6 { font-size: 0.82rem; color: var(--text-secondary); }

  .answer-display p, .interim-display p { margin: 8px 0; }
  .answer-display ul, .answer-display ol, .interim-display ul, .interim-display ol {
    margin: 6px 0 6px 20px; padding: 0;
  }
  .answer-display li, .interim-display li { margin: 3px 0; line-height: 1.6; }
  .answer-display ul > li, .interim-display ul > li { list-style: disc; }
  .answer-display ol > li, .interim-display ol > li { list-style: decimal; }
  .answer-display ul ul > li, .interim-display ul ul > li { list-style: circle; }
  .answer-display hr, .interim-display hr { border: none; border-top: 1px solid var(--border-strong); margin: 14px 0; opacity: 0.7; }

  .answer-display strong, .interim-display strong { font-weight: 600; color: #e8eefb; }
  .answer-display em, .interim-display em { font-style: italic; color: var(--text-primary); }
  .answer-display del, .interim-display del { color: var(--text-secondary); text-decoration: line-through; }

  .answer-display blockquote, .interim-display blockquote {
    margin: 10px 0; padding: 6px 12px;
    border-left: 3px solid var(--accent);
    background: rgba(59, 130, 246, 0.06);
    color: var(--text-secondary);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    line-height: 1.6;
  }

  /* 行内代码：青绿色字 + 深色底 */
  .answer-display code.inline-code, .interim-display code.inline-code,
  .answer-display :not(pre) > code, .interim-display :not(pre) > code {
    font-family: 'JetBrains Mono', Consolas, Menlo, monospace;
    font-size: 0.82rem;
    padding: 1px 6px;
    background: rgba(0, 0, 0, 0.38);
    color: #7dd3fc;
    border-radius: 4px;
    border: 1px solid rgba(125, 211, 252, 0.15);
    white-space: nowrap;
  }
  /* 代码块：独立段 + 横向滚动 */
  .answer-display pre, .interim-display pre {
    margin: 10px 0; padding: 12px 14px;
    background: #0d1016;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    overflow-x: auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    scrollbar-width: thin;
    scrollbar-color: rgba(59, 130, 246, 0.45) rgba(255,255,255,0.03);
  }
  .answer-display pre::-webkit-scrollbar, .interim-display pre::-webkit-scrollbar { height: 6px; }
  .answer-display pre::-webkit-scrollbar-thumb, .interim-display pre::-webkit-scrollbar-thumb {
    background: rgba(59,130,246,0.38); border-radius: 999px;
  }
  .answer-display pre > code, .interim-display pre > code {
    display: block;
    font-family: 'JetBrains Mono', Consolas, Menlo, monospace;
    font-size: 0.82rem; line-height: 1.55;
    color: #e2e8f0;
    white-space: pre;
    background: transparent; border: none; padding: 0;
  }

  .answer-display a, .interim-display a {
    color: #93c5fd; text-decoration: underline; text-underline-offset: 2px;
  }

  /* ==== AI loading / 成功提示：放在答案区底部 ==== */
  .answer-status { text-align: center; margin: 10px 0 14px; }
  .loading-indicator {
    color: var(--warning); padding: 8px; font-size: 13px;
    display: none;
  }
  .success-indicator {
    color: var(--success); padding: 8px; font-size: 13px;
    display: none;
  }

  /* ==== 底部：固定提问输入栏（仿移动端 IM 输入）==== */
  .app-footer {
    flex: 0 0 auto;
    padding: 8px 12px 10px;
    background: rgba(20, 27, 42, 0.96);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border-strong);
    z-index: 5;
  }
  .footer-row1 {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .shot-chip {
    flex: 0 0 auto;
    padding: 4px 10px; border-radius: var(--radius-pill);
    background: var(--accent-soft);
    border: 1px solid var(--border-active);
    color: var(--accent-ink);
    font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 55%;
  }
  .shot-chip:active { background: rgba(59, 130, 246, 0.26); }
  .shot-chip .chip-close {
    color: var(--text-secondary); cursor: pointer; font-weight: bold;
    padding-left: 4px;
  }
  .shot-chip.empty { opacity: 0.7; }
  .sync-tip {
    flex: 1 1 auto; text-align: right;
    color: var(--text-tertiary); font-size: 12px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .footer-row2 {
    display: flex; align-items: flex-end; gap: 8px;
  }
  .q-textarea-wrap {
    flex: 1 1 auto; position: relative;
  }
  .q-textarea {
    width: 100%;
    min-height: 40px; max-height: 120px;
    padding: 10px 44px 10px 12px;  /* 右侧 44px 留给内部截图小按钮 */
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    color: var(--text-primary);
    font-size: 15px;
    resize: none;
    line-height: 1.45;
    font-family: inherit;
    transition: border-color 0.15s ease;
    -webkit-appearance: none; appearance: none;
  }
  .q-textarea::placeholder { color: var(--text-tertiary); }
  .q-textarea:focus { outline: none; border-color: var(--border-active); }
  .q-inner-shot-btn {
    position: absolute; right: 6px; bottom: 6px;
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent; color: var(--text-secondary);
    border: none; cursor: pointer; padding: 0;
    font-size: 16px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .q-inner-shot-btn:active { color: var(--accent-ink); background: var(--accent-soft); }

  .ask-btn {
    flex: 0 0 auto;
    height: 40px; padding: 0 14px;
    border: none; border-radius: var(--radius-lg);
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: transform 0.08s ease, opacity 0.15s ease;
    -webkit-appearance: none; appearance: none;
  }
  .ask-btn:active { transform: scale(0.98); }
  .ask-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ==== Toast：顶部轻提示（不显示调试面板后仍保留给用户错误反馈）==== */
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    background: rgba(17, 24, 39, 0.98); color: #f8fafc;
    padding: 10px 16px; border-radius: 8px; border: 1px solid #334155;
    font-size: 13px; z-index: 10000; opacity: 0; transition: opacity 0.2s ease;
    pointer-events: none; max-width: 90%;
    white-space: pre-wrap; word-break: break-word;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: #7f1d1d; background: rgba(60, 15, 15, 0.98); color: #fca5a5; }
  .toast.ok { border-color: #065f46; background: rgba(6, 59, 42, 0.98); color: #6ee7b7; }
  .toast.warn { border-color: #b45309; background: rgba(70, 37, 4, 0.98); color: #fde68a; }

  /* ============================================================
     ⭐ H5 多轮对话历史（正序：最旧 → 最新，在手机上必须向下滚动看最新）
     与答题面板 overlay.css 的 history-* 视觉保持一致，但更贴合手机紧凑屏
     ============================================================ */
  .history-container {
    display: flex; flex-direction: column; gap: 12px;
    padding: 2px 2px 8px;
  }
  .history-round {
    position: relative;
    padding: 10px 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(255,255,255,0.016), transparent);
  }
  .history-round-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
    font-size: 11px; color: var(--text-tertiary);
  }
  .history-round-index { font-weight: 700; color: var(--text-secondary); letter-spacing: 0.03em; }
  .history-round-meta  { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .history-tag {
    display: inline-block;
    padding: 2px 8px; border-radius: 999px;
    background: rgba(59,130,246,0.12);
    color: var(--accent-ink);
    font-size: 10px; font-weight: 600;
    border: 1px solid var(--border-active);
  }
  .history-tag.src-panel   { background: rgba(99,102,241,0.14); border-color: rgba(99,102,241,0.35); color: #c7d2fe; }
  .history-tag.src-h5      { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.35); color: #6ee7b7; }
  .history-tag.src-miniapp { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.38); color: #fcd34d; }
  .history-tag.src-asr     { background: rgba(236,72,153,0.12); border-color: rgba(236,72,153,0.38); color: #f9a8d4; }
  .history-status {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px;
  }
  .history-status.asked    { background: rgba(234,179,8,0.12); color: #fde68a; border: 1px solid rgba(234,179,8,0.35); }
  .history-status.answered { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
  .history-status.error    { background: rgba(239,68,68,0.12);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
  .round-label {
    display: block;
    font-size: 11px; font-weight: 600;
    color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em;
    margin: 10px 0 6px;
  }
  .round-label:first-child { margin-top: 0; }
  .round-label.interviewer { color: var(--text-tertiary); }
  .round-label.ai          { color: var(--accent-ink); }
  .history-round .round-interim-text {
    font-size: 15px; color: var(--text-primary);
    padding: 12px 14px; min-height: 0;
    background: var(--bg-elevated); border-radius: var(--radius);
    border: 1px dashed var(--border-strong); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .history-round .round-answer-text {
    font-size: 14px; color: var(--text-primary);
    padding: 12px 14px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.12) 0%, rgba(59, 130, 246, 0.04) 100%);
    border-radius: var(--radius); border: 1px solid var(--border-active);
    line-height: 1.6; white-space: normal; word-break: break-word;
  }
  .history-round .round-answer-text.waiting {
    color: var(--text-tertiary); font-style: italic;
    background: var(--bg-elevated); border: 1px dashed var(--border);
    min-height: 60px;
  }
  .round-shot { display: none; margin: 2px 0 8px; }
  .round-shot.has-img { display: block; }
  .round-shot-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 10px; margin-bottom: -1px;
    background: rgba(15,23,42,0.7);
    border: 1px solid var(--border-strong); border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    font-size: 12px; color: var(--text-secondary);
  }
  .round-shot-close {
    background: transparent; border: none; color: var(--text-tertiary);
    cursor: pointer; font-size: 16px; line-height: 1;
    padding: 0 4px; border-radius: 6px;
  }
  .round-shot-close:active { background: rgba(255,255,255,0.08); color: #fff; }
  .round-shot-img {

<body>

<!-- 轻量 Toast 提示组件 -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

// ============================================================
// 1. 轻量 Markdown → HTML 渲染器（与 overlay-renderer.js 同一实现：
//    内置 XSS 转义、支持 ```代码块 / ###标题 / **加粗 / *斜体* / `行内代码` / 列表 / 引用 / 分隔线 / 链接）
//    AI 输出是 Markdown，必须先 renderMarkdown → set innerHTML，否则 ### 会被当纯文本显示。
// ============================================================
/** 把字符串中的 HTML 危险字符（< > & " '）转义为实体，避免 XSS */
function _escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
/** 行内格式处理（强/斜/行内代码/删除线/链接），输入必须已 escape 过 */
function _renderInline(text) {
  // 先把行内代码挑出来：`xxx` 用占位符暂存，避免其中的 * _ 被强调处理错
  const codeStore = [];
  const withCodeProtected = String(text || '').replace(/`([^`]+)`/g, (_m, code) => {
    const idx = codeStore.length; codeStore.push(code);
    return '\x00CODE:' + idx + '\x00';
  });
  let out = withCodeProtected;
  // 链接 [文字](地址)
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi, (_m, lbl, url) => {
    const safeUrl = _escapeHtml(url);
    return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${lbl}</a>`;
  });
  // 加粗 **xxx** / __xxx__
  out = out.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/__([^_]+?)__/g, '<strong>$1</strong>');
  // 斜体 *xxx* / _xxx_
  out = out.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/(^|[^_])_([^_\n]+?)_(?!_)/g, '$1<em>$2</em>');
  // 删除线 ~~xxx~~
  out = out.replace(/~~([^~]+?)~~/g, '<del>$1</del>');
  // 行内代码还原
  out = out.replace(/\x00CODE:(\d+)\x00/g, (_m, idxStr) => {
    const code = codeStore[Number(idxStr)];
    const safe = _escapeHtml(code);
    return `<code class="inline-code">${safe}</code>`;
  });
  return out;
}
/** 主入口：完整 Markdown → HTML */
function renderMarkdown(md) {
  const raw = String(md == null ? '' : md);
  if (!raw) return '';
  const normalized = raw.replace(/\r\n?/g, '\n');
  // 1) 代码块（```...```）单独切出
  const fenceStore = [];
  const noFence = normalized.replace(/```([\w+-]*)\n([\s\S]*?)\n?```/g, (_m, lang, body) => {
    const idx = fenceStore.length;
    fenceStore.push({ lang: String(lang || '').trim(), html: _escapeHtml(body) });
    return '\n\x00FENCE:' + idx + '\x00\n';
  });
  // 2) 按 \n\n 切成块
  const blocks = noFence.split(/\n{2,}/).map((b) => String(b || '').trim()).filter((b) => !!b);
  const htmlParts = [];
  for (const block of blocks) {
    if (/^\x00FENCE:\d+\x00$/.test(block)) {
      const idxStr = block.slice(7, -1);
      const fence = fenceStore[Number(idxStr)];
      if (fence) {
        const langCls = fence.lang ? ` class="language-${_escapeHtml(fence.lang)}"` : '';
        htmlParts.push(`<pre><code${langCls}>${fence.html}</code></pre>`);
      }
      continue;
    }
    // --- 分隔线
    if (/^\s*([-*_])\s*\1\s*\1[\s\S]*$/.test(block) && /^[\s*\-_]{3,}$/.test(block)) {
      htmlParts.push('<hr/>'); continue;
    }
    // ### 标题
    const h = block.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const level = h[1].length;
      htmlParts.push(`<h${level}>${_renderInline(_escapeHtml(h[2]))}</h${level}>`);
      continue;
    }
    // > 引用
    if (/^>\s?/m.test(block)) {
      const lines = block.split('\n').map((ln) => ln.replace(/^>\s?/, ''));
      htmlParts.push(`<blockquote>${_renderInline(_escapeHtml(lines.join('\n'))).replace(/\n/g, '<br/>')}</blockquote>`);
      continue;
    }
    // 有序列表
    const olLines = block.split('\n');
    if (olLines.every((ln) => /^\s*\d+\.\s+/.test(ln))) {
      const lis = olLines.map((ln) => `<li>${_renderInline(_escapeHtml(ln.replace(/^\s*\d+\.\s+/, '')))}</li>`);
      htmlParts.push(`<ol>${lis.join('')}</ol>`);
      continue;
    }
    // 无序列表
    if (olLines.every((ln) => /^\s*[-*+]\s+/.test(ln))) {
      const lis = olLines.map((ln) => `<li>${_renderInline(_escapeHtml(ln.replace(/^\s*[-*+]\s+/, '')))}</li>`);
      htmlParts.push(`<ul>${lis.join('')}</ul>`);
      continue;
    }
    // 普通段落：把单 \n 转 <br/>（GFM breaks）
    htmlParts.push(`<p>${_renderInline(_escapeHtml(block)).replace(/\n/g, '<br/>')}</p>`);
  }
  return htmlParts.join('\n');
}

// ============================================================
// 2. 全局状态
// ============================================================
const App = {
  token: '',
  host: '',
  shotDataUrl: '',          // 当前选中的截图 dataURL（供 POST /api/answer/ask 使用；为空时只提文字）
  lastShotSig: '',          // 当前截图的签名（长度+首尾，避免重复 setState 刷 DOM）
  pollTimer: null,
  lastAnswerAt: 0,
  lastQuestionImageSig: '', // 轮询拿到的截图签名，避免重复刷新
  toastTimer: null,
  // ---- ⭐ 多轮历史新增字段 ----
  historyVersion: -1,       // 上次成功渲染时的 historyVersion，用于版本号增量对比
  historyLastCount: 0,      // 上次渲染时的历史条数，判断是否新增了轮次（需要滚到底）
  refreshBusy: false,       // 刷新中标志：避免 fetch status 并发重入
};

function $(id) { return document.getElementById(id); }

// ===== Toast：轻提示（保留：错误/成功仍需提醒用户）=====
function toast(msg, type) {
  const el = $('toast');
  if (!el) return;
  el.className = 'toast show' + (type === 'ok' ? ' ok' : type === 'error' ? ' error' : type === 'warn' ? ' warn' : '');
  el.textContent = String(msg || '');
  if (App.toastTimer) clearTimeout(App.toastTimer);
  App.toastTimer = setTimeout(() => { el.className = 'toast'; }, 2400);
}

// ============================================================
// 3. 初始化 token / host
// ============================================================
function initFromUrl() {
  try {
    const u = new URL(location.href);
    App.token = (u.searchParams.get('token') || '').trim();
    App.host = `${u.protocol}//${u.host}`;
  } catch (_) {
    const m = location.search.match(/[?&]token=([^&]+)/);
    App.token = m ? decodeURIComponent(m[1]).trim() : '';
    App.host = `${location.protocol}//${location.host}`;
  }
  if (!App.token) {
    setBadge('缺少 Token', 'bad');
    toast('二维码缺少 Token，请重新扫码', 'error');
    return false;
  }
  return true;
}
function withToken(path) {
  const sep = path.indexOf('?') >= 0 ? '&' : '?';
  return `${path}${sep}token=${encodeURIComponent(App.token)}`;
}
function setBadge(text, kind) {
  const b = $('statusBadge'), d = $('titleDot');
  if (b) { b.textContent = text; b.className = 'status-badge' + (kind === 'ok' ? ' ok' : kind === 'bad' ? ' bad' : ''); }
  if (d) { d.className = 'dot' + (kind === 'ok' ? ' ok' : kind === 'bad' ? ' bad' : ''); }
}

// ============================================================
// 3.5 ⭐ 多轮对话历史渲染（H5）
//     · 正序：history[0] 最旧 → history[N-1] 最新
//     · 数据源：/api/overlay/status 返回的 history[] + historyVersion
//     · 渲染后自动滚到底部展示最新一轮（仅当有新增轮次时）
// ============================================================
/** 时间格式化：HH:mm:ss（本地时区） */
function _fmtTime(ts) {
  if (!ts) return '--:--:--';
  try {
    const d = new Date(Number(ts));
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  } catch (_) { return '--:--:--'; }
}
/** source → [显示名, CSS 类后缀] */
function _sourceMeta(source) {
  const s = String(source || 'unknown').toLowerCase();
  if (s === 'panel' || s === 'overlay' || s.startsWith('screenshot')) return ['面板截图', 'panel'];
  if (s === 'h5' || s === 'web' || s.startsWith('http'))          return ['H5 网页', 'h5'];
  if (s === 'miniapp' || s === 'wx' || s.startsWith('mini'))     return ['小程序',   'miniapp'];
  if (s === 'asr' || s.startsWith('asr') || s === 'mic')         return ['语音识别', 'asr'];
  if (s === 'unknown' || s === '') return ['其他入口', 'panel'];
  return [s, 'panel'];
}
/** status → 徽章 class + 文字 */
function _statusMeta(st) {
  if (st === 'answered') return { cls: 'answered', text: '已回答' };
  if (st === 'error')    return { cls: 'error',    text: '生成失败' };
  return { cls: 'asked', text: '正在生成…' };
}
/** 滚到 panelScrollBody 底部（forceSmooth=true 时用平滑滚动）*/
function _scrollHistoryToBottom(forceSmooth) {
  try {
    const sb = $('panelScrollBody');
    if (!sb) return;
    const doScroll = () => {
      try {
        if (forceSmooth && 'scrollTo' in sb) sb.scrollTo({ top: sb.scrollHeight, behavior: 'smooth' });
        else sb.scrollTop = sb.scrollHeight;
      } catch (_) { /* ignore */ }
    };
    // 手机浏览器需要下一帧布局完成后滚
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(doScroll);
    else setTimeout(doScroll, 0);
  } catch (_) { /* ignore */ }
}
/** 基于 history[] 全量重绘 historyContainer */
function renderHistory(history) {
  const container = $('historyContainer');
  if (!container) return;
  if (!history || !history.length) {
    container.innerHTML = `
      <div class="history-empty">
        <span class="emoji">🎙️</span>
        还没有答题记录<br/>
        点下方 <strong>📸</strong> 截电脑屏幕图，或直接输入问题点 <strong>🤖 提问</strong>
      </div>
    `;
    App.historyLastCount = 0;
    return;
  }
  const total = history.length;
  // DocumentFragment 一次性挂载，减少多次重排
  const frag = document.createDocumentFragment();
  history.forEach((round, idx) => {
    const card = document.createElement('div');
    card.className = `history-round status-${round.status || 'asked'}`;
    card.setAttribute('data-id', `r-${round.id}`);

    const [srcLabel, srcCls] = _sourceMeta(round.source);
    const sm = _statusMeta(round.status);
    const orderText = `第 ${idx + 1} 轮 / 共 ${total} 轮`;
    const timeText = _fmtTime(round.createdAt);

    // ---- 面试官问题文本（无则省略）----
    const qHtml = (round.questionText && round.questionText.trim().length)
      ? `<div class="round-interim-text">${_escapeHtml(round.questionText)}</div>`
      : '';

    // ---- 面试官截图（有 dataURL 才显示，含关闭+放大）----
    const hasImg = !!(round.questionImage && /^data:image\//i.test(round.questionImage));
    const shotHtml = hasImg
      ? `<div class="round-shot has-img" data-shotwrap>
           <div class="round-shot-bar">
             <span>📸 题目截图</span>
             <button type="button" class="round-shot-close" data-shotclose title="收起截图">×</button>
           </div>
           <img class="round-shot-img" data-shotimg src="${round.questionImage}" alt="题目截图"/>
         </div>`
      : '';

    // ---- AI 答案：answered=显示Markdown / asked=显示loading / 无内容+asked=占位 ----
    const hasAns = !!(round.answerText && round.answerText.trim().length);
    const answerHtml = hasAns
      ? `<div class="round-answer-text">${renderMarkdown(round.answerText)}</div>`
      : (round.status === 'asked')
          ? `<div class="round-answer-text waiting">（AI 正在生成，请稍候…）</div>`
          : `<div class="round-answer-text waiting">（暂无答案）</div>`;
    const loadingHtml = (round.status === 'asked' && !hasAns)
      ? `<div class="round-loading">⏳ AI 正在解题，请稍候…</div>`
      : '';
    const errorHtml = (round.status === 'error' && round.errorMsg)
      ? `<div class="round-error">⚠️ ${_escapeHtml(String(round.errorMsg))}</div>`
      : '';

    card.innerHTML = `
      <div class="history-round-header">
        <div class="history-round-index">${orderText}</div>
        <div class="history-round-meta">
          <span class="history-tag src-${srcCls}">${_escapeHtml(srcLabel)}</span>
          <span class="history-status ${sm.cls}">${sm.text}</span>
          <span title="提问时间">${timeText}</span>
        </div>
      </div>
      <div class="round-interim">
        <label class="round-label interviewer">面试官：</label>
        ${shotHtml}
        ${qHtml}
      </div>
      <div class="round-answer">
        <label class="round-label ai">AI 助手：</label>
        ${answerHtml}
        ${loadingHtml}
        ${errorHtml}
      </div>
    `;
    frag.appendChild(card);
  });

  // 清空后一次性挂载
  container.innerHTML = '';
  container.appendChild(frag);

  // ---- 绑定每一轮卡片内部的事件（关闭截图、点图放大）----
  container.querySelectorAll('.round-shot').forEach((shotEl) => {
    const closeBtn = shotEl.querySelector('[data-shotclose]');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        shotEl.classList.remove('has-img');
      });
    }
    const img = shotEl.querySelector('[data-shotimg]');
    if (img) {
      img.addEventListener('click', () => {
        const src = img.getAttribute('src');
        if (src && /^data:image\//i.test(src)) {
          try {
            const w = window.open('', '_blank', 'noopener');
            if (w) {
              w.document.write(`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" /><title>题目原图</title><style>body{margin:0;background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:8px;}img{max-width:100%;max-height:100vh;box-shadow:0 8px 30px rgba(0,0,0,.6);border-radius:8px;}</style></head><body><img src="${src}" alt="题目原图"></body></html>`);
              w.document.close();
            }
          } catch (e) { console.warn('[h5] 打开放大截图失败:', e.message); }
        }
      });
    }
  });

  App.historyLastCount = history.length;
}

/**
 * 强制刷新多轮历史（或按版本号增量）
 * @param {Object} data - /api/overlay/status 解包后的 data
 * @param {boolean} force - 是否无视版本号强制重绘（doAskAi 结束后用）
 */
function updateHistoryIfNeeded(data, force) {
  const container = $('historyContainer');
  if (!container || !data) return;
  const newVer = Number(data.historyVersion) || 0;
  const history = Array.isArray(data.history) ? data.history : [];
  const prevCount = App.historyLastCount;
  if (force || newVer !== App.historyVersion) {
    renderHistory(history);
    App.historyVersion = newVer;
    // 强制刷新 / 新增了轮次 / 从空到非空 → 滚到底部
    if (force || history.length > prevCount) {
      _scrollHistoryToBottom(!!force);
    }
    return;
  }
  // 版本一致，但最后一轮 status=asked 且 answerText 有新增 → 轻量 patch（流式更新体验）
  if (!history.length) return;
  const lastRound = history[history.length - 1];
  if (lastRound.status === 'asked' && lastRound.answerText) {
    const lastEl = container.querySelector('.history-round:last-child');
    if (!lastEl) return;
    const ansBox = lastEl.querySelector('.round-answer-text');
    if (ansBox) {
      ansBox.classList.remove('waiting');
      ansBox.innerHTML = renderMarkdown(lastRound.answerText);
    }
    const loadingEl = lastEl.querySelector('.round-loading');
    if (loadingEl) loadingEl.remove();
    _scrollHistoryToBottom(false);
  }
}

// ============================================================
// 4. 连接检测（调 /api/connect）
// ============================================================
async function checkConnect() {
  setBadge('连接检测中…', '');
  try {
    const r = await fetch(withToken('/api/connect'));
    const j = await r.json().catch(() => ({}));
    if (r.ok && j && j.ok) {
      setBadge('已连接', 'ok');
      return true;
    }
    throw new Error((j && j.msg) || `HTTP ${r.status}`);
  } catch (e) {
    setBadge('连接失败', 'bad');
    toast('连接电脑失败：' + (e.message || '未知错误'), 'error');
    return false;
  }
}

// ============================================================
// 5. 截图相关（H5 手动截图 / 从轮询同步 questionImage / 显示 / 清除）
// ============================================================
/** 计算 dataURL 的轻量签名（长度+首尾，避免长字符串比较） */
function _sig(dataUrl) {
  if (!dataUrl) return '';
  const s = String(dataUrl);
  const len = s.length;
  return len + ':' + s.substring(20, 40) + '|' + s.substring(Math.max(0, len - 16));
}
/** 在面试官区显示一张截图（用于手动截图成功后即时显示 & 轮询 questionImage 同步） */
function showInterviewScreenshot(dataUrl) {
  if (!dataUrl) return;
  App.shotDataUrl = dataUrl;
  App.lastShotSig = _sig(dataUrl);
  const wrap = $('interviewScreenshotWrap');
  const img = $('interviewScreenshot');
  if (img) { img.src = dataUrl; }
  if (wrap) { wrap.style.display = 'block'; }
  // 更新底部 chip：显示"有截图"态
  const chip = $('shotChip');
  if (chip) chip.classList.remove('empty');
  const txt = $('shotChipText');
  if (txt) txt.textContent = '已有截图';
}
/** 收起截图并清空内存 shotDataUrl（不再随提问提交） */
function clearInterviewScreenshot() {
  App.shotDataUrl = '';
  App.lastShotSig = '';
  const wrap = $('interviewScreenshotWrap');
  const img = $('interviewScreenshot');
  if (img) { img.removeAttribute('src'); }
  if (wrap) { wrap.style.display = 'none'; }
  // chip 回到空态
  const chip = $('shotChip');
  if (chip) chip.classList.add('empty');
  const txt = $('shotChipText');
  if (txt) txt.textContent = '（未选择截图）';
}

/** GET /api/screenshot：触发电脑屏幕截图 → 显示 → 后端异步自动解题 → 面板/H5同步 */
async function doScreenshot() {
  const btn1 = $('shotBtn'), btn2 = $('footerShotBtn');
  const setDisabled = (v, label) => {
    if (btn1) { btn1.disabled = v; if (label && !v) btn1.textContent = '📸'; }
    if (btn2) { btn2.disabled = v; }
  };
  if (btn1 && btn1.disabled) return;
  setDisabled(true, null);
  if (btn1) btn1.textContent = '⏳';
  try {
    const r = await fetch(withToken('/api/screenshot?format=jpeg&quality=0.85&maxSize=1600'));
    const j = await r.json().catch(() => ({}));
    if (!(r.ok && j && j.ok)) throw new Error((j && j.msg) || `HTTP ${r.status}`);
    if (!j.data || !j.mime) throw new Error('返回数据缺少截图内容');
    const dataUrl = `data:${j.mime};base64,${j.data}`;
    showInterviewScreenshot(dataUrl);
    toast(`截图成功（${j.width || '?'}×${j.height || '?'}）· AI 已开始解题`, 'ok');
  } catch (e) {
    toast('截图失败：' + (e.message || '未知错误'), 'error');
  } finally {
    setDisabled(false, 'restore');
  }
}

// ============================================================
// 6. 提交给 AI 回答（POST /api/answer/ask）
//    直接写入 AI 答案区；state 也会被后端同步，轮询会拿到相同结果
// ============================================================
async function doAskAi() {
  const btn = $('askBtn');
  if (btn && btn.disabled) return;
  const qEl = $('qInput');
  const qText = (qEl ? qEl.value : '').trim();
  if (!qText && !App.shotDataUrl) {
    toast('请先截图或填写问题文字', 'error');
    return;
  }
  if (btn) {
    btn.disabled = true;
    btn.textContent = '思考中…';
  }
  // UI：显示 loading
  const loadingEl = $('answerLoading'), readyEl = $('answerReady');
  const ansEl = $('overlayAnswerText');
  if (loadingEl) loadingEl.style.display = 'block';
  if (readyEl) readyEl.style.display = 'none';
  if (ansEl) {
    ansEl.classList.add('waiting');
    // 只清空自定义内容，保留 waiting 伪元素占位
    ansEl.innerHTML = '';
  }
  try {
    const body = { text: qText };
    if (App.shotDataUrl) body.imageDataUrl = App.shotDataUrl;

    // ⭐ 提交前先立即拉一次 /status：后端 recordState(_historyAction=question) 会先写入"正在生成"轮，
    //   让用户马上在历史列表看到第 N 轮卡片（即使答案还没返回）
    try {
      const r0 = await fetch(withToken('/api/overlay/status'));
      if (r0.ok) {
        const j0 = await r0.json().catch(() => null);
        if (j0) updateHistoryIfNeeded(j0, true);
      }
    } catch (_) { /* ignore */ }

    const r = await fetch(withToken('/api/answer/ask'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (!(r.ok && j && j.ok)) throw new Error((j && j.msg) || `HTTP ${r.status}`);
    const ans = String(j.answer || '').trim();
    // ★ 关键：AI 回答是 Markdown，必须先 renderMarkdown 再 innerHTML，不能用 textContent（会把 ### ** ``` 当纯文本）
    if (ansEl) {
      ansEl.classList.remove('waiting');
      ansEl.innerHTML = renderMarkdown(ans) || '<p style="color:var(--text-tertiary);font-style:italic">（AI 未返回内容）</p>';
    }
    if (loadingEl) loadingEl.style.display = 'none';
    if (readyEl) {
      readyEl.style.display = 'block';
      setTimeout(() => { readyEl.style.display = 'none'; }, 2000);
    }
    const cost = j.costMs ? `（${Math.round(j.costMs / 100) / 10}s）` : '';
    toast(`AI 回答完成${cost}`, 'ok');

    // ⭐ 回答完成：立即强制重绘历史（status=answered 最新一轮答案可见）
    try {
      const r1 = await fetch(withToken('/api/overlay/status'));
      if (r1.ok) {
        const j1 = await r1.json().catch(() => null);
        if (j1) updateHistoryIfNeeded(j1, true);
      }
    } catch (_) { /* ignore */ }
  } catch (e) {
    if (ansEl) {
      ansEl.classList.remove('waiting');
      ansEl.innerHTML = `<p style="color:var(--danger)">回答失败：${_escapeHtml(e.message || '未知错误')}</p>`;
    }
    if (loadingEl) loadingEl.style.display = 'none';
    toast('AI 回答失败：' + (e.message || '未知错误'), 'error');

    // ⭐ 失败也强制刷新：显示"生成失败"徽章 + 错误信息，避免停留在 loading 态
    try {
      const rErr = await fetch(withToken('/api/overlay/status'));
      if (rErr.ok) {
        const jErr = await rErr.json().catch(() => null);
        if (jErr) updateHistoryIfNeeded(jErr, true);
      }
    } catch (_) { /* ignore */ }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🤖 提问'; }
    // ⭐ 清空当前已提交的"选中截图 chip + shotDataUrl"（作为一次性提问），
    //   避免用户下一次"只发文字"时，旧截图被重复带上进入下一轮
    try {
      App.shotDataUrl = '';
      App.lastShotSig = '';
      const chipText = $('shotChipText');
      const chip = $('shotChip');
      if (chip) chip.classList.add('empty');
      if (chipText) chipText.textContent = '（未选择截图）';
      if (qEl) qEl.value = '';
    } catch (_) { /* ignore */ }
  }
}

// ============================================================
// 7. 长轮询 /api/overlay/status（兜底同步 ASR、AI 答案、questionImage）
//    1.5s 拉一次，微信浏览器 SSE 不稳定 → 继续用 fetch+setInterval
// ============================================================
function startPolling() {
  if (App.pollTimer) return;
  const tick = async () => {
    // 并发控制：避免上一次 status 请求未完成时新请求并发导致的重复渲染
    if (App.refreshBusy) return;
    App.refreshBusy = true;
    try {
      const r = await fetch(withToken('/api/overlay/status'));
      if (!r.ok) return;
      const j = await r.json();
      if (!j) return;

      // ⭐ 【新增】首先处理多轮历史：按版本号触发刷新（比单值更可靠）
      //    historyContainer 是用户实际看到的内容；旧的单值逻辑保留继续写隐藏 DOM（兼容兜底）
      try { updateHistoryIfNeeded(j, false); } catch (e) { console.warn('[h5] updateHistory:', e.message); }

      // --- ASR 面试官文本：有新内容就 update（写入隐藏的兼容容器，实际显示由 history 负责）---
      const asrEl = $('overlayInterimText');
      if (asrEl) {
        const curText = String(j.asrText || '').trim();
        const isInternalHint = /^【面试官提问[\s\S]*截图题）】/.test(curText);
        if (curText && !isInternalHint) {
          asrEl.innerHTML = renderMarkdown(curText);
        }
      }
      // --- questionImage：写入隐藏容器的截图区（实际显示由 history 渲染）---
      if (j.questionImage) {
        const sig = _sig(j.questionImage);
        if (sig && sig !== App.lastQuestionImageSig) {
          App.lastQuestionImageSig = sig;
          showInterviewScreenshot(j.questionImage);
        }
      }
      // --- AI 答案：lastAnswerAt 更新时更新隐藏容器（实际显示由 history 渲染）---
      const ansEl = $('overlayAnswerText');
      if (j.answerText && j.lastAnswerAt && j.lastAnswerAt > App.lastAnswerAt) {
        App.lastAnswerAt = j.lastAnswerAt;
        if (ansEl) {
          ansEl.classList.remove('waiting');
          ansEl.innerHTML = renderMarkdown(String(j.answerText));
        }
        const loadingEl = $('answerLoading'), readyEl = $('answerReady');
        if (loadingEl) loadingEl.style.display = 'none';
        if (readyEl) {
          readyEl.style.display = 'block';
          setTimeout(() => { readyEl.style.display = 'none'; }, 2000);
        }
      }
      // --- 同步时间戳 + 连接状态（如果连接 badge 不是 ok，刷新一次）---
      const lastSyncTip = $('lastSyncTip');
      if (lastSyncTip) lastSyncTip.textContent = '同步 ' + new Date().toLocaleTimeString();
      const badge = $('statusBadge');
      if (badge && badge.textContent.indexOf('失败') >= 0) {
        // 轮询能打通 → 说明连接已恢复，把 badge 切回 ok
        setBadge('已连接', 'ok');
      }
    } catch (_) { /* 网络抖动静默忽略，下一轮再试 */ }
    finally { App.refreshBusy = false; }
  };
  App.pollTimer = setInterval(tick, 1500);
  tick();
}

// ============================================================
// 8. 事件绑定：所有按钮/输入/链接
// ============================================================
function bindEvents() {
  // 顶部截图按钮
  try { $('shotBtn').addEventListener('click', () => doScreenshot()); } catch (e) { console.error('[bind] shotBtn:', e.message); }
  // 底部输入框内的小截图按钮
  try { $('footerShotBtn').addEventListener('click', () => doScreenshot()); } catch (e) { console.error('[bind] footerShotBtn:', e.message); }
  // 截图 chip（左侧）：点击 → 滚到截图并高亮；chip 右侧 × → 清除
  try {
    const chip = $('shotChip');
    if (chip) {
      chip.addEventListener('click', (e) => {
        // 如果点到的是 × 关闭按钮，交给另一个 listener
        if (e.target && e.target.id === 'shotChipClose') return;
        const wrap = $('interviewScreenshotWrap');
        if (!wrap || wrap.style.display === 'none') { toast('当前没有截图', 'warn'); return; }
        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  } catch (e) { console.error('[bind] shotChip:', e.message); }
  try {
    const close = $('shotChipClose');
    if (close) close.addEventListener('click', (e) => { e.stopPropagation(); clearInterviewScreenshot(); toast('已清除截图', 'ok'); });
  } catch (e) { console.error('[bind] shotChipClose:', e.message); }

  // 截图右上角 × 收起
  try {
    const btn = $('closeInterviewScreenshotBtn');
    if (btn) btn.addEventListener('click', () => clearInterviewScreenshot());
  } catch (e) { console.error('[bind] closeInterviewScreenshotBtn:', e.message); }

  // 截图图片：点击新窗口放大查看
  try {
    const img = $('interviewScreenshot');
    if (img) img.addEventListener('click', () => {
      const src = img.getAttribute('src');
      if (src && /^data:image\//i.test(src)) {
        try {
          const w = window.open('', '_blank', 'noopener');
          if (w) {
            w.document.write(`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"><title>面试题原图</title><style>body{margin:0;background:#1a1d25;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;}img{max-width:100%;max-height:100vh;box-shadow:0 8px 30px rgba(0,0,0,.6);border-radius:6px;}</style></head><body><img src="${src}" alt="面试题原图"></body></html>`);
            w.document.close();
          }
        } catch (e) { toast('打开大图失败：' + e.message, 'error'); }
      }
    });
  } catch (e) { console.error('[bind] interviewScreenshot zoom:', e.message); }

  // 提问按钮
  try { $('askBtn').addEventListener('click', () => doAskAi()); } catch (e) { console.error('[bind] askBtn:', e.message); }

  // textarea：回车=发送（Shift+回车=换行），自动扩展高度
  try {
    const ta = $('qInput');
    if (ta) {
      const autoGrow = () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(120, ta.scrollHeight) + 'px';
      };
      ta.addEventListener('input', autoGrow);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          doAskAi();
        }
      });
      // 初始化一次高度
      setTimeout(autoGrow, 0);
    }
  } catch (e) { console.error('[bind] qInput:', e.message); }
}

// ============================================================
// 9. 启动入口
// ============================================================
(async function boot() {
  if (!initFromUrl()) return;
  bindEvents();
  await checkConnect(); // 失败时 badge 变红色并 toast，轮询继续尝试
  startPolling();
})();
</script>
</body>
